<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Sign In | St. Louis Altar Servers</title>

    <script>
      (function () {
        try {
          if (localStorage.getItem("theme") === "light") {
            document.documentElement.setAttribute("data-theme", "light");
          }
        } catch (e) {}
      })();
    </script>

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="login-page">
      <div class="login-card">
        <div class="text-center mb-4">
          <div class="login-icon mb-3">
            <i class="fas fa-cross"></i>
          </div>
          <h1 class="login-title">Admin Sign In</h1>
          <p class="login-subtitle">St. John Berchmans Altar Servers</p>
        </div>

        <div
          id="loginError"
          class="login-error"
          role="alert"
          aria-live="polite"
          hidden
        ></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control contact-input"
              id="email"
              name="email"
              autocomplete="username"
              required
            />
          </div>

          <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control contact-input"
              id="password"
              name="password"
              autocomplete="current-password"
              required
            />
          </div>

          <button type="submit" class="btn btn-contact fw-bold w-100" id="submitBtn">
            <i class="fas fa-right-to-bracket me-2"></i>Sign In
          </button>
        </form>

        <div class="text-center mt-3">
          <button type="button" class="link-btn" id="forgotLink">
            Forgotten your password?
          </button>
        </div>

        <form id="forgotForm" class="forgot-form mt-3" hidden>
          <label for="forgotEmail" class="form-label">
            Enter your email and we will send you a reset link
          </label>
          <input
            type="email"
            class="form-control contact-input mb-3"
            id="forgotEmail"
            autocomplete="username"
          />
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-contact fw-bold flex-grow-1" id="forgotBtn">
              <i class="fas fa-paper-plane me-2"></i>Send reset link
            </button>
            <button type="button" class="btn btn-secondary" id="forgotCancel">
              Cancel
            </button>
          </div>
        </form>

        <div class="text-center mt-4">
          <a href="index.html" class="login-back">
            <i class="fas fa-arrow-left me-1"></i>Back to site
          </a>
        </div>
      </div>
    </main>

    <script>
      const form = document.getElementById("loginForm");
      const errorBox = document.getElementById("loginError");
      const submitBtn = document.getElementById("submitBtn");
      const forgotForm = document.getElementById("forgotForm");
      const forgotLink = document.getElementById("forgotLink");

      function showError(message) {
        errorBox.textContent = message;
        errorBox.className = "login-error";
        errorBox.hidden = false;
      }

      function showNotice(message) {
        errorBox.textContent = message;
        errorBox.className = "login-error login-notice";
        errorBox.hidden = false;
      }

      forgotLink.addEventListener("click", () => {
        forgotForm.hidden = false;
        forgotLink.hidden = true;
        errorBox.hidden = true;
        document.getElementById("forgotEmail").value =
          document.getElementById("email").value.trim();
        document.getElementById("forgotEmail").focus();
      });

      document.getElementById("forgotCancel").addEventListener("click", () => {
        forgotForm.hidden = true;
        forgotLink.hidden = false;
        errorBox.hidden = true;
      });

      forgotForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const email = document.getElementById("forgotEmail").value.trim();
        if (!email) {
          showError("Please enter your email address.");
          return;
        }

        const button = document.getElementById("forgotBtn");
        button.disabled = true;
        button.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending…';

        try {
          const response = await fetch("/api/account/forgot", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
          });
          const data = await response.json().catch(() => ({}));

          if (response.ok) {
            forgotForm.hidden = true;
            forgotLink.hidden = false;
            showNotice(data.message || "Check your inbox for a reset link.");
          } else {
            showError(data.error || "Could not send a reset link.");
          }
        } catch (err) {
          showError("Could not reach the server. Check your connection.");
        }

        button.disabled = false;
        button.innerHTML = '<i class="fas fa-paper-plane me-2"></i>Send reset link';
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        errorBox.hidden = true;

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          showError("Please enter both your email and password.");
          return;
        }

        submitBtn.disabled = true;
        submitBtn.innerHTML =
          '<i class="fas fa-spinner fa-spin me-2"></i>Signing in...';

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email, password }),
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok) {
            window.location.href = "roaster.html";
            return;
          }

          showError(data.error || "Sign in failed. Please try again.");
        } catch (err) {
          showError("Could not reach the server. Check your connection.");
        }

        submitBtn.disabled = false;
        submitBtn.innerHTML =
          '<i class="fas fa-right-to-bracket me-2"></i>Sign In';
      });
    </script>
  </body>
</html>
